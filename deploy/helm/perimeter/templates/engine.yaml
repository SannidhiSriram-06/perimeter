apiVersion: v1
kind: Service
metadata:
  name: perimeter-engine
  labels:
    app: perimeter-engine
spec:
  selector:
    app: perimeter-engine
  ports:
    - name: http
      port: {{ .Values.engine.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perimeter-engine
  labels:
    app: perimeter-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perimeter-engine
  template:
    metadata:
      labels:
        app: perimeter-engine
    spec:
      # None of these pods call the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's user is named, and Kubernetes can only verify a numeric one.
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: engine
          image: {{ .Values.engine.image }}
          imagePullPolicy: {{ .Values.engine.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PERIMETER_LLM_MODEL
              value: {{ .Values.engine.llmModel | quote }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.app }}
                  key: GROQ_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
