services:
  postgres:
    image: postgres:16-alpine
    container_name: perimeter-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: perimeter
      POSTGRES_PASSWORD: perimeter_dev_secret
      POSTGRES_DB: perimeter_db
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - perimeter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perimeter -d perimeter_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  perimeter-postgres-data:
