apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
  namespace: perimeter-test
  labels:
    app: frontend-proxy
    perimeter.io/environment: controlled-test
    tier: high
    owning-team: team-core-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-proxy
  template:
    metadata:
      labels:
        app: frontend-proxy
        perimeter.io/environment: controlled-test
        tier: high
        owning-team: team-core-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: frontend-proxy
          image: perimeter/test-services:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVICE_NAME
              value: frontend-proxy
            - name: CHECKOUT_SERVICE_URL
              value: http://checkout-service.perimeter-test.svc.cluster.local:8080/checkout
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://perimeter-otel-collector-opentelemetry-collector.perimeter.svc.cluster.local:4318/v1/traces
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-proxy
  namespace: perimeter-test
  labels:
    app: frontend-proxy
    perimeter.io/environment: controlled-test
spec:
  type: ClusterIP
  selector:
    app: frontend-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
