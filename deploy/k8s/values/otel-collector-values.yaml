# OpenTelemetry Collector: receives OTLP spans from services and prints them.
# Exporters are "debug" for now. Swap in a trace backend when one is chosen.
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch: {}
  exporters:
    debug:
      verbosity: detailed
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]
      metrics: null
      logs: null
ports:
  metrics:
    enabled: true
