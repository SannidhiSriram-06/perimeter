# kube-prometheus-stack values for Minikube. Small footprint for a laptop.
prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits: { memory: 600Mi }
grafana:
  # The password lives in a cluster Secret that up.sh creates; it is never committed.
  admin:
    existingSecret: perimeter-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # 256Mi was OOM-killed on Grafana 12; keep the limit high enough to start.
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }
alertmanager:
  enabled: true
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/perimeter-webhook/ ; up.sh creates it.
    secrets: [perimeter-webhook]
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }
  config:
    route:
      receiver: perimeter-webhook
      group_by: [alertname, service]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
    receivers:
      - name: perimeter-webhook
        webhook_configs:
          # The BFF is not deployed in the cluster yet; until it is, deliveries fail and Alertmanager retries.
          - url: http://perimeter-bff.perimeter.svc.cluster.local:3001/api/v1/alerts/webhook
            send_resolved: true
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/perimeter-webhook/token
