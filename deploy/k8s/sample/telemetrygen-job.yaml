# Sends sample spans to the collector so traces can be seen end to end.
# Stand-in for an instrumented service until the test microservices exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: sample-traces
  namespace: perimeter
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.116.0
          args:
            - traces
            - --otlp-endpoint=perimeter-otel-collector-opentelemetry-collector.perimeter.svc.cluster.local:4317
            - --otlp-insecure
            - --traces=20
            - --service=checkout-service
