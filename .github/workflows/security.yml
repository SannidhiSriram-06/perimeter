name: Security

# Free-tier notes: this repository is public, so Actions minutes on standard runners are free.
# Every job is short (about a minute), runs on ubuntu-latest, and old runs are cancelled when a branch is pushed again.
# CodeQL is not in this file: it is enabled as "default setup" in the repository settings (Security and quality > Code scanning).
# A CodeQL workflow here would clash with that setup.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Weekly run catches new advisories on dependencies that have not changed.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  npm-audit:
    name: npm audit (BFF)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/bff-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Production dependencies only: dev tooling does not ship.
      - run: npm audit --omit=dev --audit-level=high

  python-security:
    name: Python audit and bandit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: services/correlation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/correlation-engine/requirements.txt
      - run: "pip install --only-binary=:all: pip-audit==2.10.1 bandit==1.9.4"
      - name: Known vulnerabilities in pinned requirements
        run: pip-audit -r requirements.txt
      - name: Static security checks on source
        run: bandit -q -r src
