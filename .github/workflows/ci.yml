name: CI

# Trunk-based flow: every change is a pull request into main.
#   pull_request -> unit tests, lint and image builds must pass before merge.
#   push to main -> the same checks plus the integration job, which starts the real stack.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correlation-engine:
    name: Correlation engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/correlation_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: -r requirements-dev.txt"
      - run: python -m pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=85

  bff-server:
    name: BFF server build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perimeter
          POSTGRES_PASSWORD: perimeter_test
          POSTGRES_DB: perimeter_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perimeter -d perimeter_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/bff-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/bff-server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Load schema and seed data
        env:
          PGPASSWORD: perimeter_test
        run: psql -h 127.0.0.1 -U perimeter -d perimeter_db -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/deploy/db/init.sql"
      - name: Run BFF tests against Postgres
        env:
          TEST_DATABASE_URL: postgres://perimeter:perimeter_test@127.0.0.1:5432/perimeter_db
        run: npm test

  compose-config:
    name: Validate docker-compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f deploy/docker-compose.yml config -q

  lint:
    name: Lint (ruff, shellcheck, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: ruff==0.17.3"
      - run: ruff check services/correlation_engine services/test-services
      # E402 is allowed here: the harness scripts adjust sys.path before importing the engine.
      - run: ruff check --select E,F,W,B --ignore E501,E402 evaluation
      - run: shellcheck scripts/*.sh deploy/k8s/up.sh
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build services/bff-server
      - run: docker build services/correlation_engine

      - run: docker build services/test-services

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  test-services:
    name: Test services tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/test-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: -r requirements.txt pytest"
      - run: python -m pytest tests/ -q

  # Runs only after a merge to main. Builds and starts the real stack (Postgres, engine, BFF),
  # sends an alert through the webhook and checks that an incident with a blast radius was stored.
  integration:
    name: Integration (full stack)
    if: github.event_name == 'push'
    needs: [correlation-engine, bff-server, dashboard, test-services, compose-config, lint, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and send an alert
        run: ./scripts/demo.sh
      - name: Check the stored incident
        run: |
          set -a; . ./.env; set +a
          compose=(docker compose --env-file .env -f deploy/docker-compose.yml)
          row="$("${compose[@]}" exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At \
            -c "SELECT status || '|' || alert_service_id || '|' || jsonb_array_length(blast_radius) FROM incidents ORDER BY created_at DESC LIMIT 1")"
          echo "latest incident: $row"
          case "$row" in
            open\|checkout-service\|[2-9]*) ;;
            *) echo "unexpected incident row"; exit 1 ;;
          esac
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v
