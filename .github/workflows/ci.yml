name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  correlation-engine:
    name: Correlation engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/correlation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: -r requirements.txt"
      - run: python -m pytest tests/ -q

  bff-server:
    name: BFF server build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perimeter
          POSTGRES_PASSWORD: perimeter_test
          POSTGRES_DB: perimeter_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perimeter -d perimeter_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/bff-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/bff-server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Load schema and seed data
        env:
          PGPASSWORD: perimeter_test
        run: psql -h 127.0.0.1 -U perimeter -d perimeter_db -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/deploy/db/init.sql"
      - name: Run BFF tests against Postgres
        env:
          TEST_DATABASE_URL: postgres://perimeter:perimeter_test@127.0.0.1:5432/perimeter_db
        run: npm test

  compose-config:
    name: Validate docker-compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml config -q
