name: CI

# Trunk-based flow: every change is a pull request into main.
#   pull_request -> unit tests, lint and image builds must pass before merge.
#   push to main -> every job runs, regardless of which files changed.
# Pull requests only run the jobs whose files changed (see the "changes" job). The "CI gate" job at the
# bottom is the single required check: it fails if any job failed or was cancelled, and it only accepts
# "skipped" for jobs that the path filter deliberately left out.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs. On push to main every flag is true, so main always runs everything.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.out.outputs.engine }}
      bff: ${{ steps.out.outputs.bff }}
      dashboard: ${{ steps.out.outputs.dashboard }}
      test-services: ${{ steps.out.outputs.test-services }}
      stack: ${{ steps.out.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            engine:
              - 'services/correlation_engine/**'
              - '.github/workflows/ci.yml'
            bff:
              - 'services/bff-server/**'
              - 'deploy/db/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'services/dashboard/**'
              - '.github/workflows/ci.yml'
            test-services:
              - 'services/test-services/**'
              - '.github/workflows/ci.yml'
            stack:
              - 'services/**'
              - 'deploy/**'
              - 'scripts/**'
              - '.env.example'
              - '.github/workflows/ci.yml'
      - id: out
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          ENGINE: ${{ steps.filter.outputs.engine }}
          BFF: ${{ steps.filter.outputs.bff }}
          DASHBOARD: ${{ steps.filter.outputs.dashboard }}
          TEST_SERVICES: ${{ steps.filter.outputs.test-services }}
          STACK: ${{ steps.filter.outputs.stack }}
        run: |
          pick() { if [ "$IS_PR" = "true" ]; then echo "$1"; else echo true; fi; }
          {
            echo "engine=$(pick "$ENGINE")"
            echo "bff=$(pick "$BFF")"
            echo "dashboard=$(pick "$DASHBOARD")"
            echo "test-services=$(pick "$TEST_SERVICES")"
            echo "stack=$(pick "$STACK")"
          } >> "$GITHUB_OUTPUT"

  correlation-engine:
    name: Correlation engine tests
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/correlation_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/correlation_engine/requirements.txt
            services/correlation_engine/requirements-dev.txt
      - run: "pip install --only-binary=:all: -r requirements-dev.txt"
      - run: python -m pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=85

  bff-server:
    name: BFF server build
    needs: changes
    if: needs.changes.outputs.bff == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perimeter
          POSTGRES_PASSWORD: perimeter_test
          POSTGRES_DB: perimeter_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perimeter -d perimeter_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/bff-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/bff-server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Load schema and seed data
        env:
          PGPASSWORD: perimeter_test
        run: psql -h 127.0.0.1 -U perimeter -d perimeter_db -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/deploy/db/init.sql"
      - name: Run BFF tests against Postgres
        env:
          TEST_DATABASE_URL: postgres://perimeter:perimeter_test@127.0.0.1:5432/perimeter_db
        run: npm test

  compose-config:
    name: Validate docker-compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f deploy/docker-compose.yml config -q

  lint:
    name: Lint (ruff, shellcheck, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: ruff==0.17.3"
      - run: ruff check services/correlation_engine services/test-services
      # E402 is allowed here: the harness scripts adjust sys.path before importing the engine.
      - run: ruff check --select E,F,W,B --ignore E501,E402 evaluation
      - run: shellcheck scripts/*.sh deploy/k8s/up.sh
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  docker-build:
    name: Docker images build
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Only image layers are cached. The build still runs in full, so a broken Dockerfile still fails.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/bff-server
          push: false
          cache-from: type=gha,scope=bff-server
          cache-to: type=gha,scope=bff-server,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/correlation_engine
          push: false
          cache-from: type=gha,scope=correlation-engine
          cache-to: type=gha,scope=correlation-engine,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/test-services
          push: false
          cache-from: type=gha,scope=test-services
          cache-to: type=gha,scope=test-services,mode=max

  dashboard:
    name: Dashboard tests
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  test-services:
    name: Test services tests
    needs: changes
    if: needs.changes.outputs.test-services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/test-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/test-services/requirements.txt
      - run: "pip install --only-binary=:all: -r requirements.txt pytest"
      - run: python -m pytest tests/ -q

  # Builds and starts the real stack (Postgres, engine, BFF), sends an alert through the webhook and
  # checks that an incident with a blast radius was stored. Runs on main, and on pull requests that
  # touch the stack, so a PR cannot be green while the stack is broken.
  integration:
    name: Integration (full stack)
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.stack == 'true' }}
    needs: [changes, correlation-engine, bff-server, dashboard, test-services, compose-config, lint, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and send an alert
        run: ./scripts/demo.sh
      - name: Check the stored incident
        run: |
          set -a; . ./.env; set +a
          compose=(docker compose --env-file .env -f deploy/docker-compose.yml)
          row="$("${compose[@]}" exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At \
            -c "SELECT status || '|' || alert_service_id || '|' || jsonb_array_length(blast_radius) FROM incidents ORDER BY created_at DESC LIMIT 1")"
          echo "latest incident: $row"
          case "$row" in
            open\|checkout-service\|[2-9]*) ;;
            *) echo "unexpected incident row"; exit 1 ;;
          esac
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v

  # The one check to require in branch protection. It reports failure if any job failed or was cancelled.
  # "skipped" is accepted only because the path filter chose not to run that job.
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, correlation-engine, bff-server, compose-config, lint, docker-build, dashboard, test-services, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass or be deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job ended as: $r"; exit 1 ;;
            esac
          done
          [ "${{ needs.changes.result }}" = "success" ] || { echo "path detection did not succeed"; exit 1; }
          [ "${{ needs.lint.result }}" = "success" ] || { echo "lint must always run and pass"; exit 1; }
